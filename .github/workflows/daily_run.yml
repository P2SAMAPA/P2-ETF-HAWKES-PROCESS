name: Daily Hawkes Process Run

on:
  schedule:
    - cron: '30 08 * * 1-5'  # 23:23 UTC weekdays
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Julia is required for PySR (not needed for Hawkes, but keep if any)
          # However Hawkes uses scipy only; no Julia needed.
      - name: Run trainer
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python trainer.py
